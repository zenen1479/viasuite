[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[[redirects]]
  from = "/v1"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."check-trials"]
  schedule = "0 9 * * *"
